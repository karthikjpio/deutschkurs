<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch — Lernen</title>
<link rel="stylesheet" href="assets/kurs.css?v=2.0.1">
<script src="assets/kurs.js?v=2.0.1"></script>
<script src="assets/daten/kurs-liste.js?v=2.0.1"></script>
<script src="assets/daten/fundament.js?v=2.0.1"></script>
<script src="assets/daten/beruf.js?v=2.0.1"></script>
<script src="assets/daten/pruefung.js?v=2.0.1"></script>
<script src="assets/daten/schreiben.js?v=2.0.1"></script>
<script src="assets/daten/einstufung.js?v=2.0.1"></script>
<script src="assets/daten/tag-01.js?v=2.0.1"></script>
<script src="assets/daten/tag-02.js?v=2.0.1"></script>
<script src="assets/daten/tag-03.js?v=2.0.1"></script>
<script src="assets/daten/tag-04.js?v=2.0.1"></script>
<script src="assets/daten/einheiten.js?v=2.0.1"></script>
</head>
<body>
<script>KURS.kopf("lernen");</script>

<div class="wrap">

  <div class="pagehead">
    <h1>Lernen</h1>
    <p class="sub">Zwei Kurse. Erst die Fundamente, dann die zehn Einheiten aus dem Buch.
      <span class="en">Two courses: the foundations first, then the ten textbook units.</span></p>
  </div>

  <div id="weiter"></div>

  <h2>① B2-Fundamente <span class="en">— the B1 base B2 builds on</span></h2>
  <div id="kurs-fundament"></div>

  <h2>② B2 · Einheit 1–10 <span class="en">— Kompass DaF</span></h2>
  <div id="kurs-b2"></div>

</div>

<script>
/* ---------- Weitermachen ---------- */
(function () {
  var n = KURS.naechstesModul();
  var box = document.getElementById("weiter");
  if (!n) { box.innerHTML = ""; return; }
  box.innerHTML =
    '<a class="card weiterkarte" href="seite.html?id=' + encodeURIComponent(n.modul.seite) + '">' +
      '<span class="wk-l">' +
        '<span class="wk-e">Einheit ' + n.einheit.nr + ' · Modul ' + n.modul.m + '</span>' +
        '<span class="wk-t">' + KURS.esc(n.modul.titel) + '</span>' +
        '<span class="wk-s">' + KURS.esc(n.einheit.thema) + '</span>' +
      '</span>' +
      '<span class="btn primary">Weitermachen</span>' +
    '</a>';
})();

/* ---------- Kurs ①: Fundamente ---------- */
(function () {
  var themen = Object.keys(KURS.fundament || {}).length;
  var st = KURS.seitenStand("b1-fundament");
  var ein = KURS.seitenStand("einstufung");
  document.getElementById("kurs-fundament").innerHTML =
    '<div class="card">' +
      '<p class="sub">Die ' + themen + ' Grammatikthemen deiner Lehrerin, die telc-B1-Aufgabenformate ' +
      'und die B1-Briefe — zusammen an einem Ort. Alles, was die B1-Prüfung verlangt und was B2 ' +
      'voraussetzt. Kompakt gehalten: einmal durchziehen, dann weiter zu B2.</p>' +
      '<div class="kursreihe">' +
        kurszeile("b1-fundament.html", "Grammatik & Übungen",
                  themen + " Themen · adaptive Auswahl nach deinen Fehlern", st) +
        kurszeile("einstufungstest.html", "Einstufungstest",
                  "Wo stehst du zwischen B1 und B2? 42 Aufgaben.", ein) +
      '</div>' +
    '</div>';

  function kurszeile(href, titel, kurz, stand) {
    var r = stand && stand.versuche
      ? '<span class="tag-r">' + stand.letzt + '%<br><span style="font-size:11px">' +
        stand.versuche + ' Versuch(e)</span></span>'
      : '<span class="tag-r"><span style="font-size:11px">noch nicht begonnen</span></span>';
    return '<a class="tocitem fertig" href="' + href + '">' +
      '<span class="tag-txt"><span class="tag-t">' + titel + '</span>' +
      '<span class="tag-s">' + kurz + '</span></span>' + r + '</a>';
  }
})();

/* ---------- Kurs ②: die zehn Einheiten ---------- */
(function () {
  var h = [];

  KURS.einheiten.forEach(function (e) {
    var fertig = KURS.einheitFertig(e);
    h.push('<div class="ehk' + (fertig.length ? "" : " wartet") + '">' +
      '<div class="ehk-kopf">' +
        '<span class="ehk-nr">' + e.nr + '</span>' +
        '<span class="ehk-txt"><span class="ehk-t">' + KURS.esc(e.thema) + '</span>' +
        '<span class="ehk-s">KB ' + e.kb + ' · ÜB ' + e.ub + '</span></span>' +
        '<span class="ehk-z">' + fertig.length + '/4</span>' +
      '</div>' +
      '<div class="ehk-mod">' +
        e.module.map(function (m) {
          var da = m.seite && KURS.seiten[m.seite];
          var st = da ? KURS.seitenStand(m.seite) : null;
          var pct = st && st.versuche ? '<span class="mo-p">' + st.letzt + '%</span>' : '';
          var inner =
            '<span class="mo-m">' + m.m + '</span>' +
            '<span class="mo-f f-' + m.fertigkeit + '">' + KURS.FERTIGKEITEN[m.fertigkeit][0] + '</span>' +
            '<span class="mo-t">' + KURS.esc(m.titel) + '</span>' + pct;
          return da
            ? '<a class="mo" href="seite.html?id=' + encodeURIComponent(m.seite) + '">' + inner + '</a>'
            : '<span class="mo mo-off">' + inner + '</span>';
        }).join("") +
      '</div>' +
      '<div class="ehk-fuss"><b>Grammatik:</b> ' + KURS.esc(e.grammatik.join(" · ")) +
        '<br><b>Prüfungstraining:</b> ' + KURS.esc(e.pruefung) +
        (e.film ? ' · <b>Film:</b> ' + KURS.esc(e.film) : '') + '</div>' +
    '</div>');
  });

  h.push('<div class="ehk wartet ehk-spaeter">' +
    '<div class="ehk-kopf"><span class="ehk-nr">6–10</span>' +
    '<span class="ehk-txt"><span class="ehk-t">B2.2 · Lektion 6–10</span>' +
    '<span class="ehk-s">gleicher Aufbau: vier Module + Prüfungstraining</span></span></div>' +
    '<div class="ehk-fuss">Werden angelegt, sobald das B2.2-PDF im Projekt liegt. ' +
    'Am Code ändert sich dafür nichts — nur fünf neue Datendateien.</div></div>');

  document.getElementById("kurs-b2").innerHTML = h.join("");
})();
</script>
</body>
</html>
