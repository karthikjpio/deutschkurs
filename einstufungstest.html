<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einstufungstest · Deutsch B2</title>
<link rel="stylesheet" href="assets/kurs.css?v=2.1.1">
<script src="assets/kurs.js?v=2.1.1"></script>
<script src="assets/daten/alle.js?v=2.1.1"></script>
</head>
<body>
<script>KURS.kopf("lernen");</script>
<div class="wrap">
  <div id="kopf"></div>
  <div id="kurs-app"></div>
  <p class="fuss"><a href="index.html">← Kursübersicht</a> · </p>
</div>
<script>
(function () {
  var id = "einstufung";
  if (KURS.seiten[id]) {
    document.getElementById("kopf").innerHTML = KURS.seitenkopf(id);
    KURS.starte(id, "kurs-app");
  } else {
    document.getElementById("kopf").innerHTML =
      '<div class="pagehead"><div class="eyebrow"></div>' +
      '<h1>Noch kein Material</h1></div>';
    document.getElementById("kurs-app").innerHTML = KURS.leereSeite(0, "");
  }
})();
</script>
</body>
</html>
